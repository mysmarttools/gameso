<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Chess Engine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="game-header">
        <div class="header-inner">
            <div class="logo">
                <span>♔</span>
                <strong>ChessArena</strong>
            </div>
            <button class="back-button" onclick="resetGame()">Reset Game</button>
        </div>
    </header>

    <main class="game-page">
        <div class="game-container">
            
            <div class="game-heading">
                <span class="game-label">STRATEGY BOARD</span>
                <h1>Classic Chess</h1>
                <p>Play a clean, lag-free match of chess optimized for both desktop and mobile devices.</p>
            </div>

            <div class="game-box">
                <!-- Stats Section -->
                <div class="game-stats">
                    <div class="stat-box">
                        <span>TURN</span>
                        <strong id="current-turn">White</strong>
                    </div>
                    <div class="stat-box">
                        <span>STATUS</span>
                        <strong id="game-status" style="font-size: 14px; margin-top: 8px;">Active</strong>
                    </div>
                    <div class="stat-box">
                        <span>MOVES</span>
                        <strong id="move-count">0</strong>
                    </div>
                </div>

                <!-- Board Wrapper -->
                <div class="board-wrapper">
                    <div class="chess-board" id="board"></div>

                    <!-- Game Overlay (Hidden by default) -->
                    <div class="game-overlay hidden" id="overlay">
                        <div class="overlay-icon">🏆</div>
                        <h2 id="overlay-title">Game Over</h2>
                        <p id="overlay-msg">White wins by checkmate!</p>
                        <button class="game-button" onclick="resetGame()">Play Again</button>
                    </div>
                </div>

                <!-- Interactive Message -->
                <div class="game-message" id="status-message">
                    White's turn to move. Select a piece.
                </div>
            </div>

        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
