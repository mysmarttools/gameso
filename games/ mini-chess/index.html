<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mini Chess - Play Free Online | Gameso</title>

    <meta
        name="description"
        content="Play Mini Chess online for free on Gameso. Enjoy a quick chess match with simple controls on desktop and mobile."
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="chess-wrapper">

        <header class="chess-header">

            <div>
                <h1>♟️ Mini Chess</h1>
                <p>Quick Chess Challenge</p>
            </div>

            <div class="turn-box">
                Turn: <strong id="turn">White</strong>
            </div>

        </header>


        <main class="chess-game">

            <div id="chessBoard" class="chess-board"></div>


            <div class="game-controls">

                <button id="restartBtn">
                    🔄 Restart Game
                </button>

            </div>


            <div id="gameMessage" class="game-message">
                White's turn
            </div>

        </main>


        <section class="how-to-play">

            <h2>How to Play Mini Chess</h2>

            <p>
                Click a chess piece to select it, then click a highlighted
                square to move. Capture your opponent's pieces and checkmate
                the king to win.
            </p>

        </section>

    </div>


    <script src="script.js"></script>

</body>
</html>
