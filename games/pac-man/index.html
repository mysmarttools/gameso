<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Pac-Man - Play Online | Gameso</title>

  <meta
    name="description"
    content="Play Pac-Man online on Gameso. Eat pellets, avoid ghosts, collect power-ups and get the highest score."
  >

  <link
    rel="stylesheet"
    href="./style.css"
  >
</head>

<body>

  <div id="game">

    <!-- =========================
         TOP HUD
    ========================== -->

    <div class="hud">

      <div class="hud-box">
        <span>🏆 SCORE</span>
        <strong id="score">0</strong>
      </div>

      <div class="hud-box">
        <span>❤️ LIVES</span>
        <strong id="lives">3</strong>
      </div>

      <div class="hud-box">
        <span>⭐ BEST</span>
        <strong id="bestScore">0</strong>
      </div>

    </div>


    <!-- =========================
         GAME AREA
    ========================== -->

    <div class="game-container">

      <canvas
        id="gameCanvas"
        width="560"
        height="620"
      ></canvas>

    </div>


    <!-- =========================
         START SCREEN
    ========================== -->

    <div
      id="startScreen"
      class="screen"
    >

      <div class="panel">

        <div class="pacman-logo">
          🟡
        </div>

        <h1>
          Pac-Man
        </h1>

        <p>
          Eat all the pellets and avoid the ghosts!
        </p>

        <div class="controls-info">

          <div>
            ⬆️
            <span>Move Up</span>
          </div>

          <div>
            ⬇️
            <span>Move Down</span>
          </div>

          <div>
            ⬅️
            <span>Move Left</span>
          </div>

          <div>
            ➡️
            <span>Move Right</span>
          </div>

        </div>

        <button
          id="startBtn"
          type="button"
        >
          PLAY NOW
        </button>

      </div>

    </div>


    <!-- =========================
         GAME OVER
    ========================== -->

    <div
      id="gameOver"
      class="screen hidden"
    >

      <div class="panel">

        <div class="game-over-icon">
          👻
        </div>

        <h2>
          Game Over
        </h2>

        <p>
          Your Score
        </p>

        <strong
          id="finalScore"
          class="final-score"
        >
          0
        </strong>

        <p>
          Best Score:
          <b id="finalBestScore">0</b>
        </p>

        <button
          id="restartBtn"
          type="button"
        >
          PLAY AGAIN
        </button>

      </div>

    </div>


    <!-- =========================
         WIN SCREEN
    ========================== -->

    <div
      id="winScreen"
      class="screen hidden"
    >

      <div class="panel">

        <div class="game-over-icon">
          🏆
        </div>

        <h2>
          YOU WIN!
        </h2>

        <p>
          You cleared the maze!
        </p>

        <strong
          id="winScore"
          class="final-score"
        >
          0
        </strong>

        <button
          id="nextBtn"
          type="button"
        >
          PLAY AGAIN
        </button>

      </div>

    </div>


    <!-- =========================
         MOBILE CONTROLS
    ========================== -->

    <div class="mobile-controls">

      <button
        id="upBtn"
        type="button"
      >
        ▲
      </button>

      <div class="horizontal-controls">

        <button
          id="leftBtn"
          type="button"
        >
          ◀
        </button>

        <button
          id="downBtn"
          type="button"
        >
          ▼
        </button>

        <button
          id="rightBtn"
          type="button"
        >
          ▶
        </button>

      </div>

    </div>

  </div>


  <!-- Game JavaScript -->

  <script src="./game.js"></script>

</body>

</html>
